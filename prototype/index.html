<title>Grave Lantern</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen canvas; lobby = two side panels over a 3D plaza; run = HUD at screen edges. Deliberately dark-only. */
:root{--ink:#0c0a0f;--panel:#16121bee;--panel2:#211b27;--line:#3a3044;--text:#ebe1cc;--muted:#9d9283;--gold:#d6a24a;--blood:#b03a32;--heal:#7fdc96;
--display:'Grenze Gotisch',Georgia,serif;--body:'Alegreya Sans',system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font:15px/1.35 var(--body);overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.on{border-color:var(--gold);background:#3a2c1a}
h1,h2{font-family:var(--display);font-weight:500;margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:44px;line-height:1;color:var(--gold)}h2{font-size:24px;margin-bottom:8px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:#000a;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--heal)}
/* lobby */
#lobby{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,360px) 1fr minmax(0,380px);gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));pointer-events:none}
#lobby>section{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;min-width:0;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 32px)}
#lobby header{grid-column:2;align-self:start;justify-self:center;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}
.dun{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px;width:100%}
.dun .sw{width:10px;height:100%;min-height:40px;border-radius:3px}.dun b{display:block;font-size:16px}
.enter{font-family:var(--display);font-size:24px;padding:10px;background:#5a1d1a;border-color:var(--blood)}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>button{flex:1}
.item{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;background:#0006;cursor:pointer;font-size:14px}
.item:hover{background:#ffffff10}.item.sel{outline:1px solid var(--gold)}
.det{background:#0008;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:14px}
.help{font-size:13px;color:var(--muted)}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}#hud button{pointer-events:auto}
.pf{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;width:210px}
.pf>div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.pf .dead{opacity:.45}
.pf .bar{height:10px;margin-top:3px}
.rb{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:230px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.rb .t{font-size:28px;font-family:var(--display)}.rb .bar>i{background:var(--blood)}
.chip{display:inline-block;font-size:12px;border:1px solid #6e3a8a;color:#d7b0f0;border-radius:10px;padding:0 7px;margin:2px 2px 0 0}
.boss{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,46vw);text-align:center;font-family:var(--display);font-size:20px}
.boss .bar{height:12px;border:1px solid #6a2a24}.boss .bar>i{background:var(--blood)}
.sk{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.sk button{position:relative;width:74px;height:64px;padding:4px;font-size:12px;line-height:1.1;background:var(--panel);overflow:hidden}
.sk button kbd{position:absolute;top:2px;left:4px;font-size:11px;color:var(--gold);font-family:var(--body)}
.sk button .cd{position:absolute;inset:0;background:#000b;transform-origin:bottom;pointer-events:none}
.cmd{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:26px;text-shadow:0 2px 10px #000;text-align:center;white-space:nowrap;transition:opacity .4s}
.fb{position:absolute;width:54px;transform:translate(-50%,-100%);font-size:11px;text-align:center;text-shadow:0 1px 2px #000}
.fb .bar{height:5px}.fb .bar>i{background:var(--blood)}.fb .cast{height:4px;margin-top:2px}.fb .cast>i{background:#d6a24a}
.n{position:absolute;font-weight:700;text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);white-space:nowrap}
#sum,#load{position:fixed;inset:0;display:grid;place-items:center;background:#000a}
#sum>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(460px,92vw);display:flex;flex-direction:column;gap:10px}
#load{font-family:var(--display);font-size:32px;color:var(--gold)}
@media (max-width:820px){#lobby{grid-template-columns:1fr;overflow:auto;pointer-events:auto}#lobby header{grid-column:1;grid-row:1}#lobby>section{max-height:none}
.rb{width:170px;font-size:13px}.rb .t{font-size:22px}.pf{width:150px;font-size:13px}.sk button{width:60px;height:56px;font-size:11px}.boss{top:auto;bottom:90px;width:80vw}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

 float n=fract(sin(dot(floor(gl_FragCoord.xy),vec2(12.9898,78.233)))*43758.5453);if(n>smoothstep(r*.55,r,dd))discard;}}`)}}

function updateActors(dt){const all=[...S.party,...S.foes];
 for(const a of all){a.moving=0;for(const k in a.cd)a.cd[k]-=dt;a.atkCd-=dt;a.stun-=dt;a.atkT-=dt;a.castT-=dt;a.flash-=dt;if(a.taunt)a.taunt.t-=dt;if(a.dead)continue;
  a.buffs=a.buffs.filter(b=>{b.t-=dt;b.acc+=dt;if(b.acc>=.5){b.acc=0;if(b.dps)hit(b.src,a,b.dps*.5);if(b.hps)heal(b.src,a,b.hps*.5)}return b.t>0});
  if(a.leap){const L=a.leap;L.t+=dt;const p=Math.min(1,L.t/L.d);a.x=lerp(L.fx,L.tx,p);a.z=lerp(L.fz,L.tz,p);a.face=Math.atan2(L.tx-L.fx,L.tz-L.fz);a.rig.root.position.y=Math.sin(p*Math.PI)*1.4;
